<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 - Apprendre</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --primary: #16a34a;
      --dark: #000000;
      --light: #ffffff;
      --gray: #f3f4f6;
      --text: #111827;
      --text-light: #6b7280;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--light);
      font-family: 'Inter', sans-serif;
      color: var(--text);
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page {
      display: none;
      flex: 1;
    }

    .page.active {
      display: flex;
      flex-direction: column;
    }

    /* LOGIN PAGE */
    .login-page {
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      padding: 20px;
    }

    .login-box {
      background: var(--light);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--gray);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--gray);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    /* HEADER */
    .header {
      background: var(--dark);
      color: var(--light);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      padding: 8px 16px;
      background: transparent;
      color: var(--light);
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary);
    }

    .user-info {
      font-size: 13px;
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      color: var(--light);
      border: 1px solid var(--light);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: var(--light);
      color: var(--dark);
    }

    /* MAIN CONTENT */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* LEADERBOARD */
    .leaderboard-page {
      max-width: 1200px;
      margin: 0 auto;
    }

    .leaderboard-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .category-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: var(--light);
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    .cat-btn.active {
      background: var(--primary);
      color: white;
    }

    .cat-btn:hover {
      background: var(--primary);
      color: white;
    }

    .leaderboard-table {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .table-header {
      background: var(--dark);
      color: white;
      padding: 15px;
      display: grid;
      grid-template-columns: 50px 1fr 120px;
      gap: 15px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
    }

    .table-row {
      padding: 15px;
      display: grid;
      grid-template-columns: 50px 1fr 120px;
      gap: 15px;
      border-bottom: 1px solid #e5e7eb;
      align-items: center;
    }

    .rank {
      font-weight: 700;
      color: var(--primary);
      font-size: 16px;
    }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      flex-shrink: 0;
    }

    .stat-cell {
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    /* GAMES PAGE */
    .games-page {
      max-width: 800px;
      margin: 0 auto;
    }

    .games-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .game-selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: white;
      border: 2px solid var(--dark);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s;
    }

    .game-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 16px rgba(22, 163, 74, 0.1);
    }

    .game-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .game-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .difficulty-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .diff-btn {
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
    }

    .diff-btn:hover {
      opacity: 0.9;
    }

    /* GAMEPLAY */
    .gameplay-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      gap: 40px;
    }

    .game-info {
      display: flex;
      gap: 60px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .streak-info {
      text-align: center;
    }

    .streak-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .streak-value {
      font-size: 48px;
      font-weight: 700;
      color: var(--primary);
    }

    .character {
      font-size: 100px;
      font-weight: 700;
      line-height: 1;
      min-height: 120px;
    }

    .timer-bar {
      width: 280px;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-fill {
      height: 100%;
      background: var(--primary);
      animation: timerAnim 5s linear forwards;
    }

    @keyframes timerAnim {
      to { width: 0; }
    }

    /* EASY MODE - CHOICES */
    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }

    .choice-btn {
      padding: 16px;
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .choice-btn.correct {
      border-color: var(--primary);
      background: #dcfce7;
      color: var(--primary);
    }

    .choice-btn.wrong {
      border-color: #ef4444;
      background: #fee2e2;
      color: #dc2626;
    }

    .choice-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* HARD MODE - INPUT */
    .input-area {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .answer-input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }

    .answer-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .submit-btn {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* ANSWER REVEAL */
    .answer-reveal {
      padding: 20px;
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }

    .answer-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .answer-text {
      font-size: 24px;
      font-weight: 700;
      color: #d97706;
    }

    /* GAME OVER */
    .gameover-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      gap: 30px;
    }

    .gameover-title {
      font-size: 32px;
      font-weight: 700;
    }

    .stats-box {
      background: white;
      border: 2px solid var(--dark);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      min-width: 300px;
    }

    .stat-item {
      margin-bottom: 20px;
    }

    .stat-item:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
    }

    .gameover-buttons {
      display: flex;
      gap: 10px;
    }

    .gameover-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-restart {
      background: var(--primary);
      color: white;
    }

    .btn-restart:hover {
      opacity: 0.9;
    }

    .btn-quit {
      background: var(--gray);
      color: var(--text);
    }

    .btn-quit:hover {
      background: #e5e7eb;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .login-box {
        padding: 30px 20px;
      }

      .header {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }

      .nav-buttons {
        width: 100%;
        flex-wrap: wrap;
      }

      .main {
        padding: 15px;
      }

      .game-info {
        gap: 30px;
      }

      .character {
        font-size: 80px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .game-selection {
        grid-template-columns: 1fr;
      }

      .table-header, .table-row {
        grid-template-columns: 40px 1fr 100px;
      }

      .input-area {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- LOGIN PAGE -->
    <div class="page login-page active">
      <div class="login-box">
        <div class="login-title">日本語</div>
        <div class="form-group">
          <label class="form-label">Pseudo</label>
          <input type="text" class="form-input" id="usernameInput" placeholder="Ton pseudo">
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" id="passwordInput" placeholder="Ton mot de passe">
        </div>
        <div class="form-buttons">
          <button class="btn btn-primary" onclick="register()">S'inscrire</button>
          <button class="btn btn-secondary" onclick="login()">Se connecter</button>
        </div>
      </div>
    </div>

    <!-- MAIN APP (après login) -->
    <div id="mainApp" style="display: none; flex: 1; display: flex; flex-direction: column;">
      <!-- HEADER -->
      <div class="header">
        <div class="logo">日本語</div>
        <div class="nav-buttons">
          <button class="nav-btn active" onclick="goToPage('leaderboard')">📊 Classement</button>
          <button class="nav-btn" onclick="goToPage('games')">🎮 Jeux</button>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
          <div class="user-info" id="userDisplay">Joueur</div>
          <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="main">
        <!-- LEADERBOARD PAGE -->
        <div class="page leaderboard-page active">
          <h1 class="leaderboard-title">Classement</h1>
          <div class="category-buttons">
            <button class="cat-btn active" onclick="changeCategory('exp')">💰 EXP</button>
            <button class="cat-btn" onclick="changeCategory('hiragana')">あ Hiragana</button>
            <button class="cat-btn" onclick="changeCategory('katakana')">ア Katakana</button>
          </div>
          <div class="leaderboard-table">
            <div class="table-header">
              <div>#</div>
              <div>Joueur</div>
              <div id="headerStat">EXP Total</div>
            </div>
            <div id="leaderboardList"></div>
          </div>
        </div>

        <!-- GAMES PAGE -->
        <div class="page games-page">
          <h1 class="games-title">Choisir un jeu</h1>
          <div class="game-selection">
            <div class="game-card">
              <div class="game-icon">あ</div>
              <div class="game-name">Hiragana</div>
              <div class="difficulty-btns">
                <button class="diff-btn" onclick="startGame('hiragana', 'easy')">Easy</button>
                <button class="diff-btn" onclick="startGame('hiragana', 'hard')">Difficile</button>
              </div>
            </div>
            <div class="game-card">
              <div class="game-icon">ア</div>
              <div class="game-name">Katakana</div>
              <div class="difficulty-btns">
                <button class="diff-btn" onclick="startGame('katakana', 'easy')">Easy</button>
                <button class="diff-btn" onclick="startGame('katakana', 'hard')">Difficile</button>
              </div>
            </div>
          </div>
        </div>

        <!-- GAMEPLAY PAGE -->
        <div class="page" id="gameplayPage">
          <div class="gameplay-page">
            <div class="game-info">
              <div class="streak-info">
                <div class="streak-label">Streak</div>
                <div class="streak-value" id="streakDisplay">0</div>
              </div>
              <div class="streak-info">
                <div class="timer-bar">
                  <div class="timer-fill" id="timerBar"></div>
                </div>
              </div>
            </div>

            <div class="character" id="gameCharacter">あ</div>

            <div id="gameContent"></div>
          </div>
        </div>

        <!-- GAMEOVER PAGE -->
        <div class="page gameover-page">
          <h1 class="gameover-title">Partie Terminée!</h1>
          <div class="stats-box">
            <div class="stat-item">
              <div class="stat-label">Streak Final</div>
              <div class="stat-value" id="finalStreak">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">EXP Gagné</div>
              <div class="stat-value" id="finalExp">0</div>
            </div>
          </div>
          <div class="gameover-buttons">
            <button class="gameover-btn btn-restart" onclick="restartGame()">Recommencer</button>
            <button class="gameover-btn btn-quit" onclick="quitGame()">Quitter</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DATA
    const hiraganaData = [

    const katakanaData = [
      { char: 'ア', romaji: 'a' }, { char: 'イ', romaji: 'i' }, { char: 'ウ', romaji: 'u' }, { char: 'エ', romaji: 'e' }, { char: 'オ', romaji: 'o' },

      { char: 'ハ', romaji: 'ha' }, { char: 'ヒ', romaji: 'hi' }, { char: 'フ', romaji: 'fu' }, { char: 'ヘ', romaji: 'he' }, { char: 'ホ', romaji: 'ho' },
      { char: 'バ', romaji: 'ba' }, { char: 'ビ', romaji: 'bi' }, { char: 'ブ', romaji: 'bu' }, { char: 'ベ', romaji: 'be' }, { char: 'ボ', romaji: 'bo' },
      { char: 'パ', romaji: 'pa' }, { char: 'ピ', romaji: 'pi' }, { char: 'プ', romaji: 'pu' }, { char: 'ペ', romaji: 'pe' }, { char: 'ポ', romaji: 'po' },
      { char: 'マ', romaji: 'ma' }, { char: 'ミ', romaji: 'mi' }, { char: 'ム', romaji: 'mu' }, { char: 'メ', romaji: 'me' }, { char: 'モ', romaji: 'mo' },
      { char: 'ヤ', romaji: 'ya' }, { char: 'ユ', romaji: 'yu' }, { char: 'ヨ', romaji: 'yo' },
      { char: 'ラ', romaji: 'ra' }, { char: 'リ', romaji: 'ri' }, { char: 'ル', romaji: 'ru' }, { char: 'レ', romaji: 're' }, { char: 'ロ', romaji: 'ro' },
      { char: 'ワ', romaji: 'wa' }, { char: 'ヲ', romaji: 'wo' }, { char: 'ン', romaji: 'n' }
    ];

    // STATE
    let state = {
      userId: null,
      username: null,
      currentGameType: null,
      currentGameDifficulty: null,
      currentStreak: 0,
      currentExp: 0,
      currentChar: null,
      correctAnswer: null,
      timerRunning: false,
      timerTimeout: null,
      currentLeaderboardCategory: 'exp'
    };

    // LOAD USER FROM SESSION
    window.addEventListener('load', () => {
      const savedUserId = localStorage.getItem('userId');
      if (savedUserId) {
        state.userId = savedUserId;
        showApp();
      }
    });

    // AUTH
    async function login() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      
      if (!username || !password) {
        alert('Remplis les deux champs!');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          state.userId = data.userId;
          state.username = data.username;
          localStorage.setItem('userId', state.userId);
          showApp();
        } else {
          alert(data.error || 'Erreur de connexion');
        }
      } catch (e) {
        alert('Erreur: ' + e.message);
      }
    }

    function register() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      
      if (!username || !password) {
        alert('Remplis les deux champs!');
        return;
      }

      login();
    }

    function logout() {
      state.userId = null;
      state.username = null;
      localStorage.removeItem('userId');
      document.querySelector('.login-page').classList.add('active');
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('usernameInput').value = '';
      document.getElementById('passwordInput').value = '';
    }

    function showApp() {
      document.querySelector('.login-page').classList.remove('active');
      document.getElementById('mainApp').style.display = 'flex';
      document.getElementById('userDisplay').textContent = state.username;
      loadLeaderboard();
    }

    // LEADERBOARD
    async function loadLeaderboard() {
      try {
        const res = await fetch(`/api/leaderboard/${state.currentLeaderboardCategory}`);
        const data = await res.json();
        
        const list = document.getElementById('leaderboardList');
        list.innerHTML = data.map((player, idx) => `
          <div class="table-row">
            <div class="rank">${idx + 1}</div>
            <div class="player-cell">
              <div class="avatar">${player.username[0].toUpperCase()}</div>
              <div>${player.username}</div>
            </div>
            <div class="stat-cell">
              ${state.currentLeaderboardCategory === 'hiragana' ? player.maxStreakHira :
                state.currentLeaderboardCategory === 'katakana' ? player.maxStreakKata :
                player.totalExp}
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Erreur leaderboard:', e);
      }
    }

    function changeCategory(cat) {
      state.currentLeaderboardCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      
      const labels = { exp: 'EXP Total', hiragana: 'Hiragana', katakana: 'Katakana' };
      document.getElementById('headerStat').textContent = labels[cat];
      
      loadLeaderboard();
    }

    // GAMES
    function goToPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      if (page === 'leaderboard') {
        document.querySelector('.leaderboard-page').classList.add('active');
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        loadLeaderboard();
      } else {
        document.querySelector('.games-page').classList.add('active');
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
      }
    }

    function startGame(type, difficulty) {
      state.currentGameType = type;
      state.currentGameDifficulty = difficulty;
      state.currentStreak = 0;
      state.currentExp = 0;
      
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('gameplayPage').classList.add('active');
      
      nextQuestion();
    }

    function nextQuestion() {
      if (state.timerRunning) return;
      
      const data = state.currentGameType === 'hiragana' ? hiraganaData : katakanaData;
      const item = data[Math.floor(Math.random() * data.length)];
      state.currentChar = item.char;
      state.correctAnswer = item.romaji;
      
      document.getElementById('gameCharacter').textContent = state.currentChar;
      document.getElementById('streakDisplay').textContent = state.currentStreak;
      
      const content = document.getElementById('gameContent');
      
      if (state.currentGameDifficulty === 'easy') {
        // 3 choix
        const wrong = data.filter(x => x.romaji !== state.correctAnswer)
          .sort(() => Math.random() - 0.5).slice(0, 2).map(x => x.romaji);
        const answers = [state.correctAnswer, ...wrong].sort(() => Math.random() - 0.5);
        
        content.innerHTML = `
          <div class="choices">
            ${answers.map(ans => `<button class="choice-btn" onclick="easyAnswer('${ans}')">${ans}</button>`).join('')}
          </div>
        `;
      } else {
        // Input texte
        content.innerHTML = `
          <div class="input-area">
            <input type="text" class="answer-input" id="hardInput" placeholder="Tape la réponse" autofocus>
            <button class="submit-btn" onclick="hardAnswer()">Valider</button>
          </div>
        `;
        document.getElementById('hardInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') hardAnswer();
        });
      }
      
      startTimer();
    }

    function easyAnswer(ans) {
      if (!state.timerRunning) return;
      state.timerRunning = false;
      clearTimeout(state.timerTimeout);
      
      if (ans === state.correctAnswer) {
        state.currentStreak++;
        if (state.currentStreak >= 5) {
          state.currentExp += 10;
        }
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
        setTimeout(() => nextQuestion(), 600);
      } else {
        endGame(true);
      }
    }

    function hardAnswer() {
      if (!state.timerRunning) return;
      const input = document.getElementById('hardInput').value.trim().toLowerCase();
      state.timerRunning = false;
      clearTimeout(state.timerTimeout);
      
      if (input === state.correctAnswer) {
        state.currentStreak++;
        if (state.currentStreak >= 5) {
          state.currentExp += 10;
        }
        document.getElementById('hardInput').disabled = true;
        document.querySelector('.submit-btn').disabled = true;
        setTimeout(() => nextQuestion(), 600);
      } else {
        endGame(false, input);
      }
    }

    function startTimer() {
      state.timerRunning = true;
      const bar = document.getElementById('timerBar');
      bar.style.animation = 'none';
      setTimeout(() => {
        bar.style.animation = 'timerAnim 5s linear forwards';
      }, 10);
      
      state.timerTimeout = setTimeout(() => {
        if (state.timerRunning) {
          state.timerRunning = false;
          endGame(false);
        }
      }, 5000);
    }

    function endGame(showAnswer = false, userAnswer = null) {
      state.timerRunning = false;
      clearTimeout(state.timerTimeout);
      
      // Sauvegarder les stats
      const data = state.currentGameType === 'hiragana' ? hiraganaData : katakanaData;
      const isHira = state.currentGameType === 'hiragana';
      
      if (isHira) {
        localStorage.setItem('maxStreakHira', Math.max(parseInt(localStorage.getItem('maxStreakHira') || 0), state.currentStreak));
      } else {
        localStorage.setItem('maxStreakKata', Math.max(parseInt(localStorage.getItem('maxStreakKata') || 0), state.currentStreak));
      }
      
      localStorage.setItem('totalExp', parseInt(localStorage.getItem('totalExp') || 0) + state.currentExp);
      localStorage.setItem('totalGames', parseInt(localStorage.getItem('totalGames') || 0) + 1);
      
      // Sauvegarder aussi côté serveur
      fetch(`/api/user/${state.userId}/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          maxStreakHira: isHira ? state.currentStreak : null,
          maxStreakKata: !isHira ? state.currentStreak : null,
          totalExp: state.currentExp,
          totalGames: 1
        })
      });
      
      document.getElementById('finalStreak').textContent = state.currentStreak;
      document.getElementById('finalExp').textContent = state.currentExp;
      
      // Afficher la réponse si raté
      if (showAnswer === false) {
        const content = document.getElementById('gameContent');
        const item = (state.currentGameType === 'hiragana' ? hiraganaData : katakanaData)
          .find(x => x.char === state.currentChar);
        
        content.innerHTML += `
          <div class="answer-reveal">
            <div class="answer-label">Bonne réponse</div>
            <div class="answer-text">${item.romaji}</div>
          </div>
        `;
      }
      
      setTimeout(() => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelector('.gameover-page').classList.add('active');
      }, 1500);
    }

    function restartGame() {
      startGame(state.currentGameType, state.currentGameDifficulty);
    }

    function quitGame() {
      goToPage('games');
    }
  </script>
</body>
</html>
