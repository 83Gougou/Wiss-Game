<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 - Apprendre</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --primary: #2563eb;
      --dark: #1e293b;
      --light: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-light: #475569;
      --bg: #ffffff;
      --success: #10b981;
      --error: #ef4444;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--light);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .container {
      display: grid;
      grid-template-columns: 250px 1fr;
      width: 100%;
      height: 100vh;
      gap: 1px;
      background: var(--border);
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--bg);
      padding: 30px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 30px;
      color: var(--primary);
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-light);
      font-size: 14px;
      font-weight: 500;
    }

    .nav-item:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .nav-item.active {
      background: #dbeafe;
      color: var(--primary);
      font-weight: 600;
    }

    /* MAIN */
    .main {
      background: var(--bg);
      overflow-y: auto;
      padding: 40px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* QUIZ PAGE */
    .quiz-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      gap: 50px;
    }

    .quiz-header {
      display: flex;
      gap: 80px;
      align-items: center;
    }

    .streak-display {
      text-align: center;
    }

    .streak-number {
      font-size: 56px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .flame {
      font-size: 48px;
      animation: flameFlicker 0.6s infinite;
    }

    @keyframes flameFlicker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .timer-display {
      text-align: center;
    }

    .timer-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .timer-countdown {
      font-size: 48px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .mode-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 10px 24px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text-light);
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    .mode-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .character {
      font-size: 140px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 700px;
    }

    .answer-btn {
      padding: 20px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: #dbeafe;
    }

    .answer-btn.correct {
      border-color: var(--success);
      background: #d1fae5;
      color: var(--success);
    }

    .answer-btn.wrong {
      border-color: var(--error);
      background: #fee2e2;
      color: var(--error);
    }

    .answer-btn:disabled {
      cursor: not-allowed;
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(239, 68, 68, 0.2);
      display: none;
      pointer-events: none;
      animation: overlayFlash 0.6s ease-out;
      z-index: 100;
    }

    .overlay.show {
      display: block;
    }

    @keyframes overlayFlash {
      from { background: rgba(239, 68, 68, 0.4); }
      to { background: rgba(239, 68, 68, 0); }
    }

    /* USERS/FRIENDS LIST */
    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .user-card {
      background: var(--light);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.2s;
    }

    .user-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      font-weight: 700;
      margin: 0 auto 15px;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .user-stats {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 15px;
    }

    .user-stat-line {
      display: flex;
      justify-content: space-around;
      margin-bottom: 8px;
    }

    .user-action-btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    .user-action-btn:hover {
      opacity: 0.9;
    }

    .user-action-btn.friend {
      background: var(--success);
    }

    .user-action-btn.added {
      background: var(--text-light);
      cursor: default;
    }

    /* PROFILE PAGE */
    .profile-card {
      background: var(--light);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 12px;
      max-width: 600px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border);
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: white;
      font-weight: 700;
      flex-shrink: 0;
    }

    .profile-info h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .profile-info p {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .stat-box {
      background: var(--light);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-box-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .stat-box-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* REFERENCE PAGE */
    .reference-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 15px;
    }

    .char-card {
      background: var(--light);
      border: 1px solid var(--border);
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .char-card:hover {
      border-color: var(--primary);
      background: #dbeafe;
    }

    .char-display {
      font-size: 36px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .char-romaji {
      font-size: 11px;
      color: var(--text-light);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 30px;
      color: var(--text);
      font-weight: 700;
    }

    h3 {
      font-size: 16px;
      margin-bottom: 20px;
      margin-top: 30px;
      color: var(--text);
      font-weight: 600;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        left: -250px;
        top: 0;
        width: 250px;
        height: 100vh;
        z-index: 1000;
        transition: left 0.3s;
      }

      .sidebar.active {
        left: 0;
      }

      .main {
        padding: 20px;
      }

      .quiz-header {
        gap: 30px;
      }

      .character {
        font-size: 80px;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .users-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="logo">日本語</div>
      <div class="nav-item active" data-page="quiz">🎮 Quiz</div>
      <div class="nav-item" data-page="reference">📖 Caractères</div>
      <div class="nav-item" data-page="online">👥 Gens en ligne</div>
      <div class="nav-item" data-page="friends">💬 Mes Amis</div>
      <div class="nav-item" data-page="profile">👤 Profile</div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- QUIZ PAGE -->
      <div id="quiz" class="page active">
        <div class="quiz-wrapper">
          <div class="mode-toggle">
            <button class="mode-btn active" data-mode="hiragana">Hiragana</button>
            <button class="mode-btn" data-mode="katakana">Katakana</button>
          </div>

          <div class="quiz-header">
            <div class="streak-display">
              <div class="streak-number">
                <span id="streak">0</span>
                <span class="flame">🔥</span>
              </div>
            </div>
            <div class="timer-display">
              <div class="timer-label">Temps</div>
              <div class="timer-countdown" id="countdown">5</div>
            </div>
          </div>

          <div class="character" id="character">あ</div>

          <div class="answers" id="answers"></div>
        </div>
      </div>

      <!-- REFERENCE PAGE -->
      <div id="reference" class="page">
        <h2>Hiragana & Katakana</h2>
        <h3>Hiragana</h3>
        <div class="reference-grid" id="hiraganaGrid"></div>
        <h3>Katakana</h3>
        <div class="reference-grid" id="katakanaGrid"></div>
      </div>

      <!-- ONLINE USERS PAGE -->
      <div id="online" class="page">
        <h2>Gens en ligne</h2>
        <div class="users-grid" id="onlineGrid"></div>
      </div>

      <!-- FRIENDS PAGE -->
      <div id="friends" class="page">
        <h2>Mes Amis</h2>
        <div class="users-grid" id="friendsGrid"></div>
      </div>

      <!-- PROFILE PAGE -->
      <div id="profile" class="page">
        <h2>Mon Profile</h2>
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">A</div>
            <div class="profile-info">
              <h2 id="profileName">Utilisateur</h2>
              <p id="friendsCount">Amis: 0</p>
            </div>
          </div>

          <h3>Statistiques</h3>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-box-value" id="maxHira">0</div>
              <div class="stat-box-label">Max Streak Hiragana</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-value" id="maxKata">0</div>
              <div class="stat-box-label">Max Streak Katakana</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-value" id="totalExp">0</div>
              <div class="stat-box-label">Total EXP</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-value" id="totalQuestions">0</div>
              <div class="stat-box-label">Questions</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <script>
    // DATA
    const hiraganaData = [
      { char: 'あ', romaji: 'a' }, { char: 'い', romaji: 'i' }, { char: 'う', romaji: 'u' }, { char: 'え', romaji: 'e' }, { char: 'お', romaji: 'o' },
      { char: 'か', romaji: 'ka' }, { char: 'き', romaji: 'ki' }, { char: 'く', romaji: 'ku' }, { char: 'け', romaji: 'ke' }, { char: 'こ', romaji: 'ko' },
      { char: 'が', romaji: 'ga' }, { char: 'ぎ', romaji: 'gi' }, { char: 'ぐ', romaji: 'gu' }, { char: 'げ', romaji: 'ge' }, { char: 'ご', romaji: 'go' },
      { char: 'さ', romaji: 'sa' }, { char: 'し', romaji: 'si' }, { char: 'す', romaji: 'su' }, { char: 'せ', romaji: 'se' }, { char: 'そ', romaji: 'so' },
      { char: 'ざ', romaji: 'za' }, { char: 'じ', romaji: 'zi' }, { char: 'ず', romaji: 'zu' }, { char: 'ぜ', romaji: 'ze' }, { char: 'ぞ', romaji: 'zo' },
      { char: 'た', romaji: 'ta' }, { char: 'ち', romaji: 'ti' }, { char: 'つ', romaji: 'tu' }, { char: 'て', romaji: 'te' }, { char: 'と', romaji: 'to' },
      { char: 'だ', romaji: 'da' }, { char: 'ぢ', romaji: 'di' }, { char: 'づ', romaji: 'du' }, { char: 'で', romaji: 'de' }, { char: 'ど', romaji: 'do' },
      { char: 'な', romaji: 'na' }, { char: 'に', romaji: 'ni' }, { char: 'ぬ', romaji: 'nu' }, { char: 'ね', romaji: 'ne' }, { char: 'の', romaji: 'no' },
      { char: 'は', romaji: 'ha' }, { char: 'ひ', romaji: 'hi' }, { char: 'ふ', romaji: 'hu' }, { char: 'へ', romaji: 'he' }, { char: 'ほ', romaji: 'ho' },
      { char: 'ば', romaji: 'ba' }, { char: 'び', romaji: 'bi' }, { char: 'ぶ', romaji: 'bu' }, { char: 'べ', romaji: 'be' }, { char: 'ぼ', romaji: 'bo' },
      { char: 'ぱ', romaji: 'pa' }, { char: 'ぴ', romaji: 'pi' }, { char: 'ぷ', romaji: 'pu' }, { char: 'ぺ', romaji: 'pe' }, { char: 'ぽ', romaji: 'po' },
      { char: 'ま', romaji: 'ma' }, { char: 'み', romaji: 'mi' }, { char: 'む', romaji: 'mu' }, { char: 'め', romaji: 'me' }, { char: 'も', romaji: 'mo' },
      { char: 'や', romaji: 'ya' }, { char: 'ゆ', romaji: 'yu' }, { char: 'よ', romaji: 'yo' },
      { char: 'ら', romaji: 'ra' }, { char: 'り', romaji: 'ri' }, { char: 'る', romaji: 'ru' }, { char: 'れ', romaji: 're' }, { char: 'ろ', romaji: 'ro' },
      { char: 'わ', romaji: 'wa' }, { char: 'を', romaji: 'wo' }, { char: 'ん', romaji: 'n' }
    ];

    const katakanaData = [
      { char: 'ア', romaji: 'a' }, { char: 'イ', romaji: 'i' }, { char: 'ウ', romaji: 'u' }, { char: 'エ', romaji: 'e' }, { char: 'オ', romaji: 'o' },
      { char: 'カ', romaji: 'ka' }, { char: 'キ', romaji: 'ki' }, { char: 'ク', romaji: 'ku' }, { char: 'ケ', romaji: 'ke' }, { char: 'コ', romaji: 'ko' },
      { char: 'ガ', romaji: 'ga' }, { char: 'ギ', romaji: 'gi' }, { char: 'グ', romaji: 'gu' }, { char: 'ゲ', romaji: 'ge' }, { char: 'ゴ', romaji: 'go' },
      { char: 'サ', romaji: 'sa' }, { char: 'シ', romaji: 'si' }, { char: 'ス', romaji: 'su' }, { char: 'セ', romaji: 'se' }, { char: 'ソ', romaji: 'so' },
      { char: 'ザ', romaji: 'za' }, { char: 'ジ', romaji: 'zi' }, { char: 'ズ', romaji: 'zu' }, { char: 'ゼ', romaji: 'ze' }, { char: 'ゾ', romaji: 'zo' },
      { char: 'タ', romaji: 'ta' }, { char: 'チ', romaji: 'ti' }, { char: 'ツ', romaji: 'tu' }, { char: 'テ', romaji: 'te' }, { char: 'ト', romaji: 'to' },
      { char: 'ダ', romaji: 'da' }, { char: 'ヂ', romaji: 'di' }, { char: 'ヅ', romaji: 'du' }, { char: 'デ', romaji: 'de' }, { char: 'ド', romaji: 'do' },
      { char: 'ナ', romaji: 'na' }, { char: 'ニ', romaji: 'ni' }, { char: 'ヌ', romaji: 'nu' }, { char: 'ネ', romaji: 'ne' }, { char: 'ノ', romaji: 'no' },
      { char: 'ハ', romaji: 'ha' }, { char: 'ヒ', romaji: 'hi' }, { char: 'フ', romaji: 'hu' }, { char: 'ヘ', romaji: 'he' }, { char: 'ホ', romaji: 'ho' },
      { char: 'バ', romaji: 'ba' }, { char: 'ビ', romaji: 'bi' }, { char: 'ブ', romaji: 'bu' }, { char: 'ベ', romaji: 'be' }, { char: 'ボ', romaji: 'bo' },
      { char: 'パ', romaji: 'pa' }, { char: 'ピ', romaji: 'pi' }, { char: 'プ', romaji: 'pu' }, { char: 'ペ', romaji: 'pe' }, { char: 'ポ', romaji: 'po' },
      { char: 'マ', romaji: 'ma' }, { char: 'ミ', romaji: 'mi' }, { char: 'ム', romaji: 'mu' }, { char: 'メ', romaji: 'me' }, { char: 'モ', romaji: 'mo' },
      { char: 'ヤ', romaji: 'ya' }, { char: 'ユ', romaji: 'yu' }, { char: 'ヨ', romaji: 'yo' },
      { char: 'ラ', romaji: 'ra' }, { char: 'リ', romaji: 'ri' }, { char: 'ル', romaji: 'ru' }, { char: 'レ', romaji: 're' }, { char: 'ロ', romaji: 'ro' },
      { char: 'ワ', romaji: 'wa' }, { char: 'ヲ', romaji: 'wo' }, { char: 'ン', romaji: 'n' }
    ];

    // STATE
    const state = {
      mode: 'hiragana',
      streak: 0,
      maxStreakHira: 0,
      maxStreakKata: 0,
      exp: 0,
      totalQuestions: 0,
      username: 'User' + Math.floor(Math.random() * 10000),
      userId: null,
      friends: [],
      onlineUsers: [],
      currentChar: null,
      correctAnswer: null,
      timerInterval: null,
      currentTimer: 5
    };

    // SOCKET
    const socket = io();

    socket.on('connect', () => {
      state.userId = localStorage.getItem('userId');
      socket.emit('user_join', state.username, { userId: state.userId });
    });

    socket.on('user_id', (userId) => {
      state.userId = userId;
      localStorage.setItem('userId', userId);
    });

    socket.on('online_users', (users) => {
      state.onlineUsers = users;
      if (document.querySelector('#online.page.active')) {
        renderOnlineUsers();
      }
    });

    // LOAD & SAVE
    function loadState() {
      const saved = localStorage.getItem('japaneseState');
      if (saved) {
        const parsed = JSON.parse(saved);
        Object.assign(state, parsed);
      }
    }

    function saveState() {
      localStorage.setItem('japaneseState', JSON.stringify({
        maxStreakHira: state.maxStreakHira,
        maxStreakKata: state.maxStreakKata,
        exp: state.exp,
        totalQuestions: state.totalQuestions,
        username: state.username
      }));

      if (state.userId) {
        socket.emit('update_stats', state.userId, {
          maxStreakHira: state.maxStreakHira,
          maxStreakKata: state.maxStreakKata,
          exp: state.exp,
          totalQuestions: state.totalQuestions
        });
      }
    }

    loadState();
    init();

    function init() {
      renderReference();
      updateProfile();
      setupNav();
      setupModes();
      newQuestion();
    }

    // QUIZ
    function newQuestion() {
      clearTimeout(state.timerInterval);
      const data = state.mode === 'hiragana' ? hiraganaData : katakanaData;
      const item = data[Math.floor(Math.random() * data.length)];
      state.currentChar = item.char;
      state.correctAnswer = item.romaji;

      document.getElementById('character').textContent = state.currentChar;

      const wrong = data
        .filter(x => x.romaji !== state.correctAnswer)
        .sort(() => Math.random() - 0.5)
        .slice(0, 2)
        .map(x => x.romaji);

      const answers = [state.correctAnswer, ...wrong].sort(() => Math.random() - 0.5);

      const container = document.getElementById('answers');
      container.innerHTML = '';
      answers.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = ans;
        btn.onclick = () => checkAnswer(ans, btn);
        container.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      state.currentTimer = 5;
      updateTimerDisplay();

      state.timerInterval = setInterval(() => {
        state.currentTimer--;
        updateTimerDisplay();

        if (state.currentTimer <= 0) {
          clearInterval(state.timerInterval);
          timeoutAnswer();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('countdown').textContent = Math.max(0, state.currentTimer);
    }

    function checkAnswer(answer, btn) {
      clearInterval(state.timerInterval);
      document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);

      const isCorrect = answer === state.correctAnswer;

      if (isCorrect) {
        btn.classList.add('correct');
        state.streak++;
        state.exp += 10;
        state.totalQuestions++;
        if (state.mode === 'hiragana') {
          state.maxStreakHira = Math.max(state.maxStreakHira, state.streak);
        } else {
          state.maxStreakKata = Math.max(state.maxStreakKata, state.streak);
        }
      } else {
        btn.classList.add('wrong');
        document.querySelector('.answer-btn').classList.add('correct');
        showOverlay();
        state.streak = 0;
        state.totalQuestions++;
      }

      updateStats();
      saveState();

      setTimeout(() => newQuestion(), isCorrect ? 600 : 1000);
    }

    function timeoutAnswer() {
      const buttons = document.querySelectorAll('.answer-btn');
      buttons.forEach(b => {
        b.disabled = true;
        if (b.textContent === state.correctAnswer) {
          b.classList.add('correct');
        } else {
          b.classList.add('wrong');
        }
      });
      showOverlay();
      state.streak = 0;
      state.totalQuestions++;
      updateStats();
      saveState();
      setTimeout(() => newQuestion(), 1000);
    }

    function showOverlay() {
      const overlay = document.getElementById('overlay');
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 600);
    }

    // REFERENCE
    function renderReference() {
      document.getElementById('hiraganaGrid').innerHTML = hiraganaData.map(item => 
        `<div class="char-card"><div class="char-display">${item.char}</div><div class="char-romaji">${item.romaji}</div></div>`
      ).join('');

      document.getElementById('katakanaGrid').innerHTML = katakanaData.map(item => 
        `<div class="char-card"><div class="char-display">${item.char}</div><div class="char-romaji">${item.romaji}</div></div>`
      ).join('');
    }

    // ONLINE USERS
    function renderOnlineUsers() {
      const grid = document.getElementById('onlineGrid');
      grid.innerHTML = state.onlineUsers.map(user => `
        <div class="user-card">
          <div class="user-avatar">${user.username[0]}</div>
          <div class="user-name">${user.username}</div>
          <div class="user-stats">
            <div class="user-stat-line">
              <span>Streak: ${user.maxStreak}</span>
              <span>EXP: ${user.exp}</span>
            </div>
          </div>
          <button class="user-action-btn ${state.friends.find(f => f.id === user.id) ? 'added' : ''}" 
                  onclick="addFriend('${user.id}', '${user.username}', ${user.maxStreak}, ${user.exp})"
                  ${state.friends.find(f => f.id === user.id) ? 'disabled' : ''}>
            ${state.friends.find(f => f.id === user.id) ? '✓ Ami' : 'Ajouter'}
          </button>
        </div>
      `).join('');
    }

    // FRIENDS
    function renderFriends() {
      const grid = document.getElementById('friendsGrid');
      if (state.friends.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: var(--text-light);">Pas d\'amis pour le moment<br>Ajoute des amis depuis "Gens en ligne"!</div>';
        return;
      }

      grid.innerHTML = state.friends.map(friend => `
        <div class="user-card">
          <div class="user-avatar">${friend.username[0]}</div>
          <div class="user-name">${friend.username}</div>
          <div class="user-stats">
            <div class="user-stat-line">
              <span>Streak: ${friend.maxStreak}</span>
              <span>EXP: ${friend.exp}</span>
            </div>
          </div>
          <button class="user-action-btn friend">👤 Profile</button>
        </div>
      `).join('');
    }

    function addFriend(userId, username, maxStreak, exp) {
      if (!state.friends.find(f => f.id === userId)) {
        state.friends.push({ id: userId, username, maxStreak, exp });
        socket.emit('add_friend', state.userId, userId);
        saveState();
        renderOnlineUsers();
        renderFriends();
      }
    }

    // PROFILE
    function updateProfile() {
      document.getElementById('profileName').textContent = state.username;
      document.getElementById('profileAvatar').textContent = state.username[0];
      document.getElementById('friendsCount').textContent = `Amis: ${state.friends.length}`;
      document.getElementById('maxHira').textContent = state.maxStreakHira;
      document.getElementById('maxKata').textContent = state.maxStreakKata;
      document.getElementById('totalExp').textContent = state.exp;
      document.getElementById('totalQuestions').textContent = state.totalQuestions;
    }

    function updateStats() {
      document.getElementById('streak').textContent = state.streak;
      updateProfile();
    }

    // NAV
    function setupNav() {
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          const page = item.dataset.page;
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          document.getElementById(page).classList.add('active');
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');

          if (page === 'online') renderOnlineUsers();
          if (page === 'friends') renderFriends();
        });
      });
    }

    function setupModes() {
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.mode = btn.dataset.mode;
          newQuestion();
        });
      });
    }

    // MOBILE
    if (window.innerWidth <= 768) {
      const menuBtn = document.createElement('button');
      menuBtn.textContent = '☰';
      menuBtn.style.cssText = 'position: fixed; top: 20px; left: 20px; z-index: 999; padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;';
      menuBtn.onclick = () => document.getElementById('sidebar').classList.toggle('active');
      document.body.appendChild(menuBtn);
    }

    // AUTO SAVE
    setInterval(saveState, 10000);
  </script>
</body>
</html>
